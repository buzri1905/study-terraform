name: terraform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the plan job widens it for OIDC.
permissions:
  contents: read

env:
  TF_VERSION: "1.16.0"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -recursive -check -diff .

  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      # -backend=false keeps validate credential-free: it checks syntax,
      # types and provider schemas without touching remote state.
      - run: make validate

  docs:
    name: terraform-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: terraform-docs/gh-actions@v1
        with:
          working-dir: project/modules/vpc,project/modules/ecs,project/modules/rds
          config-file: .terraform-docs.yml
          output-file: README.md
          output-method: inject
          fail-on-diff: true

  plan:
    name: plan
    runs-on: ubuntu-latest
    needs: [fmt, validate]
    # Only runs once an OIDC role is wired up. Set the repository variable
    # AWS_ROLE_ARN to enable it; until then the job is skipped, not failed.
    if: vars.AWS_ROLE_ARN != ''
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        dir:
          - project/envs/dev
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform init
        run: terraform -chdir=${{ matrix.dir }} init
      - name: terraform plan
        run: terraform -chdir=${{ matrix.dir }} plan -no-color -lock-timeout=5m
